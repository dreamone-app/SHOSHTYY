<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة لشوشو 💬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.2/confetti.browser.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  :root{
    --ink:#1b1b2f;
    --bg:#fdf1e4;
    --bubble-mine-1:#ff9472;
    --bubble-mine-2:#f2709c;
    --bubble-her:#ffffff;
    --teal:#2ec4b6;
    --teal-deep:#1b7a70;
    --gold:#ffbf69;
    --grey-tick:#9aa5b1;
    --blue-tick:#4fc3f7;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}

  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(255,148,114,0.25), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(46,196,182,0.22), transparent 45%),
      var(--bg);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
  }

  /* ---------- PHONE FRAME ---------- */
  .phone{
    width:100%;
    max-width:380px;
    height:88vh;
    max-height:760px;
    background:#fff;
    border-radius:38px;
    box-shadow:0 24px 60px rgba(27,27,47,0.25), 0 0 0 10px #17171f;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .notch{
    position:absolute;
    top:6px; left:50%; transform:translateX(-50%);
    width:110px; height:20px;
    background:#17171f;
    border-radius:20px;
    z-index:10;
  }

  .statusbar{
    background:#17171f;
    color:#fff;
    font-size:0.7rem;
    padding:14px 22px 6px;
    display:flex;
    justify-content:space-between;
    font-weight:700;
  }

  .chatheader{
    background:linear-gradient(120deg, var(--teal-deep), var(--teal));
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:var(--ink);
    font-size:1rem;
  }
  .chat-title{font-weight:700;font-size:0.98rem;}
  .chat-status{font-size:0.72rem;opacity:0.85;}
  .header-sound{
    margin-right:auto;
    background:rgba(255,255,255,0.2);
    border:none;
    color:#fff;
    width:32px;height:32px;
    border-radius:50%;
    font-size:0.95rem;
    cursor:pointer;
  }

  .chatbody{
    flex:1;
    overflow-y:auto;
    padding:16px 12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    background-image:
      radial-gradient(rgba(46,196,182,0.06) 1px, transparent 1px);
    background-size:16px 16px;
  }
  .chatbody::-webkit-scrollbar{width:0;}

  .bubble-row{display:flex;width:100%;animation:pop-in 0.35s ease;}
  @keyframes pop-in{ from{opacity:0; transform:translateY(8px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .bubble-row.mine{justify-content:flex-start;}
  .bubble-row.her{justify-content:flex-end;}

  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:16px;
    font-size:0.92rem;
    line-height:1.6;
    position:relative;
  }
  .bubble.mine{
    background:var(--bubble-her);
    border:1px solid #eee;
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .bubble.her{
    background:linear-gradient(135deg, var(--bubble-mine-1), var(--bubble-mine-2));
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble .meta{
    display:block;
    font-size:0.62rem;
    margin-top:4px;
    opacity:0.75;
    text-align:left;
  }
  .bubble.her .meta{color:rgba(255,255,255,0.85);}
  .ticks{color:var(--blue-tick);}

  .typing-row{display:flex;justify-content:flex-start;}
  .typing-bubble{
    background:#eef0f2;
    border-radius:16px;
    border-bottom-left-radius:4px;
    padding:12px 16px;
    display:flex;
    gap:4px;
  }
  .typing-bubble span{
    width:6px;height:6px;background:#9aa5b1;border-radius:50%;
    animation:tdot 1s infinite ease-in-out;
    opacity:0.8;
  }
  .typing-bubble span:nth-child(2){animation-delay:0.15s;}
  .typing-bubble span:nth-child(3){animation-delay:0.3s;}
  @keyframes tdot{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  /* ---------- CARD BUBBLES ---------- */
  .card-bubble{
    max-width:88%;
    background:#fff;
    border:1px solid #f0e4d8;
    border-radius:18px;
    padding:14px;
    box-shadow:0 6px 16px rgba(27,27,47,0.08);
    width:88%;
  }
  .card-bubble h4{font-size:0.9rem;color:var(--teal-deep);margin-bottom:8px;}

  .choice-row{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .chip-btn{
    background:#fff;
    border:1.5px solid var(--teal);
    color:var(--teal-deep);
    padding:9px 14px;
    border-radius:20px;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
    text-align:center;
  }
  .chip-btn:active{background:var(--teal);color:#fff;}

  /* game card */
  .game-hud-row{display:flex;justify-content:space-between;font-size:0.78rem;font-weight:700;color:var(--teal-deep);margin-bottom:6px;}
  .game-goal-line{font-size:0.75rem;color:#e0663f;font-weight:700;margin-bottom:6px;text-align:center;}
  .mini-game-area{
    position:relative;height:210px;background:#fbf6ef;border-radius:12px;overflow:hidden;border:1.5px dashed #e7d9c8;
  }
  .heart-item{position:absolute;top:-26px;font-size:1.5rem;cursor:pointer;animation:fall linear forwards;user-select:none;}
  @keyframes fall{ to{ top:100%; } }
  .pop{animation:pop 0.25s ease forwards !important;}
  @keyframes pop{ to{ transform:scale(1.7); opacity:0;} }
  .bad-pop{animation:badpop 0.25s ease forwards !important;}
  @keyframes badpop{ to{ transform:scale(1.4) rotate(12deg); opacity:0;} }
  .game-msg-line{text-align:center;font-size:0.82rem;margin-top:6px;padding:0 8px;}
  .game-fail{color:#e0663f;font-weight:700;}
  .game-win{color:var(--teal-deep);font-weight:700;}

  /* voice note */
  .voice-bubble{
    display:flex;align-items:center;gap:10px;
    max-width:82%;
  }
  .play-btn{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg, var(--bubble-mine-1), var(--bubble-mine-2));
    border:none;
    display:flex;align-items:center;justify-content:center;
    font-size:1rem;
    cursor:pointer;
    flex-shrink:0;
    color:#fff;
  }
  .wave{display:flex;align-items:center;gap:2px;flex:1;height:22px;}
  .wave span{width:3px;background:var(--teal);border-radius:2px;opacity:0.7;}
  .wave.playing span{animation:wv 0.8s ease-in-out infinite;}
  @keyframes wv{ 0%,100%{transform:scaleY(0.4);} 50%{transform:scaleY(1);} }

  /* photo bubble */
  .photo-bubble{
    max-width:70%;
    border-radius:16px;
    overflow:hidden;
    border:1px solid #eee;
  }
  .photo-bubble img{width:100%;display:block;}
  .photo-placeholder{
    width:220px;height:160px;
    background:linear-gradient(135deg,#ffe3d3,#ffd7e6);
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;
    color:#fff;
  }

  /* countdown card */
  .cd-mini-row{display:flex;justify-content:center;gap:8px;margin-top:8px;}
  .cd-mini{
    background:var(--teal-deep);color:#fff;border-radius:10px;
    padding:8px 8px;min-width:46px;text-align:center;
  }
  .cd-mini .n{font-weight:900;font-size:1rem;display:block;}
  .cd-mini .l{font-size:0.58rem;display:block;opacity:0.85;}

  /* birthday puzzle */
  .puzzle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:#fbf6ef;border:1.5px dashed #e7d9c8;border-radius:12px;
    padding:10px 12px;margin-bottom:8px;gap:8px;
  }
  .puzzle-eq{font-size:0.95rem;font-weight:700;color:var(--teal-deep);}
  .puzzle-input{
    width:56px;text-align:center;padding:8px 4px;border-radius:10px;
    border:1.5px solid var(--teal);font-family:'Cairo',sans-serif;font-weight:700;font-size:0.95rem;
  }
  .puzzle-input:focus{outline:none;border-color:var(--bubble-mine-2);}

  /* certificate attachment */
  .attach-bubble{
    max-width:84%;
    background:#fff;
    border:1px solid #eee;
    border-radius:14px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .attach-icon{
    width:44px;height:44px;border-radius:10px;
    background:linear-gradient(135deg,var(--bubble-mine-1),var(--bubble-mine-2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;flex-shrink:0;
  }
  .attach-text{font-size:0.8rem;flex:1;}
  .attach-dl{
    background:var(--teal);color:#fff;border:none;border-radius:10px;
    padding:8px 12px;font-size:0.75rem;font-weight:700;cursor:pointer;
  }

  /* ---------- BOTTOM ACTION BAR ---------- */
  .actionbar{
    padding:10px 14px 16px;
    background:#fff;
    border-top:1px solid #f0e4d8;
  }
  .continue-btn{
    width:100%;
    background:linear-gradient(135deg, var(--bubble-mine-1), var(--bubble-mine-2));
    color:#fff;
    border:none;
    padding:13px;
    border-radius:26px;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
  }
  .continue-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .upload-inline{
    display:block;
    text-align:center;
    background:var(--teal);
    color:#fff;
    padding:11px;
    border-radius:26px;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
    margin-bottom:8px;
  }
  .upload-inline input{display:none;}
  .hint-line{text-align:center;font-size:0.72rem;color:#9c8f81;margin-bottom:6px;}

  .yt-hidden{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;top:0;left:0;}

  @media (prefers-reduced-motion: reduce){ .bubble-row{animation:none;} }
</style>
</head>
<body>

  <div id="ytplayer" class="yt-hidden"></div>

  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span>📶 🔋</span>
    </div>
    <div class="chatheader">
      <div class="avatar">ع</div>
      <div>
        <div class="chat-title">عمر</div>
        <div class="chat-status" id="chatStatus">متصلة الآن</div>
      </div>
      <button class="header-sound" id="soundToggle">🔇</button>
    </div>

    <div class="chatbody" id="chatBody"></div>

    <div class="actionbar" id="actionBar">
      <div class="hint-line">دوسي "استمرار" عشان تشوفي اللي بعده</div>
      <button class="continue-btn" id="continueBtn">استمرار ⬇️</button>
    </div>
  </div>

<script>
  const chatBody = document.getElementById('chatBody');
  const actionBar = document.getElementById('actionBar');
  const continueBtn = document.getElementById('continueBtn');
  const chatStatus = document.getElementById('chatStatus');

  function scrollBottom(){ chatBody.scrollTop = chatBody.scrollHeight; }

  function addBubble(html, side){
    const row = document.createElement('div');
    row.className = 'bubble-row ' + side;
    row.innerHTML = html;
    chatBody.appendChild(row);
    scrollBottom();
    return row;
  }

  function timeNow(){
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function addText(text, side){
    const tickHtml = side === 'her' ? '<span class="ticks"> ✓✓</span>' : '';
    addBubble(`<div class="bubble ${side}">${text}<span class="meta">${timeNow()}${tickHtml}</span></div>`, side);
  }

  function showTyping(){
    return new Promise(resolve => {
      chatStatus.textContent = 'بيكتب...';
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.innerHTML = '<div class="typing-bubble"><span></span><span></span><span></span></div>';
      chatBody.appendChild(row);
      scrollBottom();
      setTimeout(() => {
        row.remove();
        chatStatus.textContent = 'متصلة الآن';
        resolve();
      }, 2600 + Math.random()*1200);
    });
  }

  async function sayMine(text){
    await showTyping();
    addText(text, 'mine');
    await wait(2800);
  }

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  function waitForContinue(label){
    return new Promise(resolve => {
      continueBtn.textContent = label || 'استمرار ⬇️';
      continueBtn.disabled = false;
      actionBar.style.display = 'block';
      continueBtn.onclick = () => {
        continueBtn.disabled = true;
        actionBar.style.display = 'none';
        resolve();
      };
    });
  }

  /* ---------------- MAIN SCRIPT FLOW ---------------- */
  async function run(){
    actionBar.style.display = 'none';

    await sayMine('يا شهد 👋');
    await sayMine('بصي هقولك حاجة بسرعة، وبعدين سيبك من الزعل 😄');
    await sayMine('إنتي أهم واحدة في قائمة الأصحاب عندي، وعارفة كدا كويس 😌');

    // choice bubble
    await showChoice();

    // reasons as quick separate bubbles
    await sayMine('على فكرة... في حاجات كتير خلتني أحبك كصحبة أصلاً');
    await sayMine('😂 بتضحكيني في أوقات غلط خالص');
    await sayMine('🫶 وبتسمعيني من غير ما أقولك إني محتاج حد يسمعني');
    await sayMine('🎯 وصريحة معايا حتى لو الكلام تقيل');
    await wait(800);
    await waitForContinue('طيب وبعدين؟ ⬇️');

    // mini game card
    await sayMine('تعالي بقى نلعب حاجة بسيطة 🎮 بس فيه شرط... خدي بالك في القلوب المكسورة 💔');
    await showGameCard();

    // photo
    await sayMine('تمام كده 🎉 دلوقتي حطيلي صورة تفكرنا باللحظة دي 📸');
    await showPhotoCard();

    // voice note (song)
    await sayMine('وكمان بعتلك رسالة صوتية صغيرة 🎤');
    await showVoiceNote();

    // birthday countdown (revealed via a puzzle)
    await sayMine('وعشان منستناش لحد كدا... جهزتلك لغز صغير يكشفلك حاجة مهمة 🧠');
    await showBirthdayPuzzle();
    await showCountdownCard();

    // final apology
    await sayMine('طيب خلاص كفاية دلع 🙏😂');
    await sayMine('سامحيني؟');
    await showFinalChoice();
  }

  /* ---------------- CHOICE BUBBLE ---------------- */
  function showChoice(){
    return new Promise(resolve => {
      const row = addBubble(`
        <div class="card-bubble">
          <h4>اختاري رد مناسب 👇</h4>
          <div class="choice-row">
            <button class="chip-btn" data-c="1">طبعاً يا حبيبتي 😘</button>
            <button class="chip-btn" data-c="2">يلا قولها بسرعة 😏</button>
          </div>
        </div>`, 'her');
      row.querySelectorAll('.chip-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const val = btn.getAttribute('data-c');
          addText(btn.textContent, 'her');
          row.remove();
          if (val === '1'){ await sayMine('😍 دي كانت متوقعة أصلاً'); }
          else { await sayMine('😂 طيب ماشي هقول بسرعة'); }
          resolve();
        });
      });
    });
  }

  /* ---------------- MINI GAME ---------------- */
  const REQUIRED_SCORE = 10;
  const GAME_TIME = 16;
  function showGameCard(){
    return new Promise(resolve => {
      const row = addBubble(`
        <div class="card-bubble">
          <h4>🎮 تحدي شوشو</h4>
          <div class="game-goal-line">امسكي ${REQUIRED_SCORE} قلوب 💜 وابعدي عن 💔 عشان نكمل</div>
          <div class="game-hud-row"><span>النقاط: <span id="gs">0</span></span><span>الوقت: <span id="gt">${GAME_TIME}</span>s</span></div>
          <div class="mini-game-area" id="gArea"></div>
          <button class="continue-btn" id="gStartBtn" style="margin-top:8px;">ابدأ التحدي 🎮</button>
        </div>`, 'her');

      const gArea = row.querySelector('#gArea');
      const gStartBtn = row.querySelector('#gStartBtn');
      const gs = row.querySelector('#gs');
      const gt = row.querySelector('#gt');

      let score = 0, time = GAME_TIME, spawnIv, timeIv, speedUp;

      gStartBtn.addEventListener('click', () => {
        gArea.innerHTML = '';
        score = 0; time = GAME_TIME;
        gs.textContent = 0; gt.textContent = GAME_TIME;
        gStartBtn.disabled = true;
        gStartBtn.textContent = 'بتلعبي...';

        let spawnSpeed = 480;
        function spawnHeart(){
          const h = document.createElement('div');
          h.className = 'heart-item';
          const isBad = Math.random() < 0.3;
          h.textContent = isBad ? '💔' : ['💜','🧡','💛','✨'][Math.floor(Math.random()*4)];
          h.dataset.bad = isBad ? '1' : '0';
          h.style.left = Math.random()*82 + '%';
          h.style.animationDuration = (1.5 + Math.random()*1.0) + 's';
          h.addEventListener('click', () => {
            if (h.classList.contains('pop')) return;
            h.classList.add('pop');
            if (h.dataset.bad === '1'){
              score = Math.max(0, score - 1);
              h.classList.add('bad-pop');
            } else {
              score++;
            }
            gs.textContent = score;
            setTimeout(() => h.remove(), 250);
          });
          h.addEventListener('animationend', e => { if (e.animationName !== 'pop') h.remove(); });
          gArea.appendChild(h);
        }
        spawnIv = setInterval(spawnHeart, spawnSpeed);
        // gets a bit faster (and harder) as time passes
        speedUp = setInterval(() => {
          if (spawnSpeed > 300){
            spawnSpeed -= 40;
            clearInterval(spawnIv);
            spawnIv = setInterval(spawnHeart, spawnSpeed);
          }
        }, 4000);

        timeIv = setInterval(() => {
          time--; gt.textContent = time;
          if (time <= 0){
            clearInterval(timeIv); clearInterval(spawnIv); clearInterval(speedUp);
            gArea.querySelectorAll('.heart-item').forEach(h => h.remove());
            const msg = document.createElement('div');
            msg.className = 'game-msg-line';
            if (score >= REQUIRED_SCORE){
              msg.classList.add('game-win');
              msg.textContent = 'كسبتي! 🎉 مسكتي ' + score;
              gArea.appendChild(msg);
              gStartBtn.style.display = 'none';
              if (typeof confetti === 'function'){ confetti({particleCount:80, spread:75, origin:{y:0.6}}); }
              setTimeout(async () => {
                row.remove();
                await sayMine('برافو عليكي! 🎉 كسبتي فعلاً');
                resolve();
              }, 900);
            } else {
              msg.classList.add('game-fail');
              msg.textContent = 'مسكتي ' + score + ' بس من ' + REQUIRED_SCORE + '... جربي تاني 💪';
              gArea.appendChild(msg);
              gStartBtn.disabled = false;
              gStartBtn.textContent = 'حاولي تاني 🔁';
            }
          }
        }, 1000);
      });
    });
  }

  /* ---------------- PHOTO ---------------- */
  function showPhotoCard(){
    return new Promise(resolve => {
      const row = addBubble(`
        <div class="card-bubble">
          <label class="upload-inline">ارفعي صورة 📤<input type="file" accept="image/*" id="photoInput"></label>
          <div id="photoPreviewWrap" style="text-align:center;">
            <div class="photo-placeholder" style="margin:0 auto;border-radius:12px;">🖼️</div>
          </div>
          <button class="continue-btn" id="photoSkipBtn" style="margin-top:8px;">تمام، كمّلي ⬇️</button>
        </div>`, 'her');

      row.querySelector('#photoInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          row.querySelector('#photoPreviewWrap').innerHTML =
            '<div class="photo-bubble" style="margin:0 auto;"><img src="' + ev.target.result + '"></div>';
        };
        reader.readAsDataURL(file);
      });

      row.querySelector('#photoSkipBtn').addEventListener('click', () => {
        const img = row.querySelector('.photo-bubble img');
        row.remove();
        if (img){
          addBubble('<div class="photo-bubble"><img src="' + img.src + '"></div>', 'her');
        }
        resolve();
      });
    });
  }

  /* ---------------- VOICE NOTE (SONG) ---------------- */
  let ytPlayer = null, ytReady = false, ytPlaying = false;
  function onYouTubeIframeAPIReady(){
    ytPlayer = new YT.Player('ytplayer', {
      videoId: 'jNkfeLvMS-M',
      playerVars: { autoplay:0, mute:0, controls:0 },
      events: { onReady: function(){ ytReady = true; } }
    });
  }
  function showVoiceNote(){
    return new Promise(resolve => {
      const row = addBubble(`
        <div class="bubble mine voice-bubble">
          <button class="play-btn" id="playBtn">▶️</button>
          <div class="wave" id="waveEl">
            ${Array.from({length:14}).map(()=>'<span style="height:'+(6+Math.random()*16)+'px"></span>').join('')}
          </div>
          <span style="font-size:0.7rem;">0:32</span>
        </div>`, 'mine');
      const playBtn = row.querySelector('#playBtn');
      const waveEl = row.querySelector('#waveEl');
      playBtn.addEventListener('click', () => {
        if (!ytReady) return;
        if (!ytPlaying){
          ytPlayer.playVideo();
          ytPlaying = true;
          playBtn.textContent = '⏸️';
          waveEl.classList.add('playing');
          document.getElementById('soundToggle').textContent = '🔊';
        } else {
          ytPlayer.pauseVideo();
          ytPlaying = false;
          playBtn.textContent = '▶️';
          waveEl.classList.remove('playing');
        }
      });
      setTimeout(async () => {
        await sayMine('دي أغنية "على بالي" لرامي صبري 🎵 دوسي تشغيل لو حابة');
        resolve();
      }, 400);
    });
  }

  /* ---------------- BIRTHDAY PUZZLE ---------------- */
  function showBirthdayPuzzle(){
    return new Promise(resolve => {
      const row = addBubble(`
        <div class="card-bubble">
          <h4>🧮 لغزك الليلة</h4>
          <p style="text-align:center;font-size:0.8rem;margin-bottom:10px;color:#8a7a68;">حلي المعادلتين عشان تكتشفي مفاجأة 🎁</p>
          <div class="puzzle-row">
            <span class="puzzle-eq">اليوم = 7 × 2 + 5</span>
            <input type="number" id="puzzleDayInput" class="puzzle-input" placeholder="؟">
          </div>
          <div class="puzzle-row">
            <span class="puzzle-eq">الشهر = 15 ÷ 3</span>
            <input type="number" id="puzzleMonthInput" class="puzzle-input" placeholder="؟">
          </div>
          <button class="continue-btn" id="puzzleCheckBtn">أنا حليت! ✅</button>
          <div class="game-msg-line" id="puzzleMsg"></div>
        </div>`, 'her');

      const dayInput = row.querySelector('#puzzleDayInput');
      const monthInput = row.querySelector('#puzzleMonthInput');
      const msg = row.querySelector('#puzzleMsg');

      row.querySelector('#puzzleCheckBtn').addEventListener('click', () => {
        const d = parseInt(dayInput.value, 10);
        const m = parseInt(monthInput.value, 10);
        if (d === 19 && m === 5){
          msg.className = 'game-msg-line game-win';
          msg.textContent = 'برافو! حليتي اللغز 🎉';
          if (typeof confetti === 'function'){ confetti({particleCount:100, spread:85, origin:{y:0.6}}); }
          setTimeout(() => {
            row.remove();
            resolve();
          }, 1300);
        } else {
          msg.className = 'game-msg-line game-fail';
          msg.textContent = 'مش كده... جربي تاني 🤔';
        }
      });
    });
  }

  /* ---------------- COUNTDOWN CARD (REVEAL) ---------------- */
  function showCountdownCard(){
    return new Promise(resolve => {
      const row = addBubble(`
        <div class="card-bubble">
          <h4>🎉 كشفتي السر! ده معادك الجاي 🎂</h4>
          <div class="cd-mini-row">
            <div class="cd-mini"><span class="n" id="cdD">--</span><span class="l">يوم</span></div>
            <div class="cd-mini"><span class="n" id="cdH">--</span><span class="l">ساعة</span></div>
            <div class="cd-mini"><span class="n" id="cdM">--</span><span class="l">دقيقة</span></div>
            <div class="cd-mini"><span class="n" id="cdS">--</span><span class="l">ثانية</span></div>
          </div>
          <p style="text-align:center;font-size:0.78rem;margin-top:8px;color:#8a7a68;">19 مايو 🎈</p>
          <button class="continue-btn" id="cdNextBtn" style="margin-top:8px;">كمّلي ⬇️</button>
        </div>`, 'her');

      function tick(){
        const now = new Date();
        let y = now.getFullYear();
        let t = new Date(y,4,19,0,0,0);
        if (t < now) t = new Date(y+1,4,19,0,0,0);
        const diff = t - now;
        row.querySelector('#cdD').textContent = Math.floor(diff/(1000*60*60*24));
        row.querySelector('#cdH').textContent = String(Math.floor((diff/(1000*60*60))%24)).padStart(2,'0');
        row.querySelector('#cdM').textContent = String(Math.floor((diff/(1000*60))%60)).padStart(2,'0');
        row.querySelector('#cdS').textContent = String(Math.floor((diff/1000)%60)).padStart(2,'0');
      }
      tick();
      const iv = setInterval(tick, 1000);

      row.querySelector('#cdNextBtn').addEventListener('click', () => {
        clearInterval(iv);
        row.remove();
        resolve();
      });
    });
  }

  /* ---------------- FINAL CHOICE + CERT ---------------- */
  let forgiveClicks = 0;
  const MAX_FORGIVE_LOOPS = 4;
  function showFinalChoice(){
    return new Promise(resolve => {
      const forced = forgiveClicks >= MAX_FORGIVE_LOOPS;
      const noLabel = forced ? 'خلاص سامحتك 😂❤' : 'لسه شوية 😏';

      const row = addBubble(`
        <div class="card-bubble">
          <h4>حكاية السماح 😄</h4>
          <div class="choice-row">
            <button class="chip-btn" id="yesBtn">خلاص سامحتك 😂❤</button>
            <button class="chip-btn" id="noBtn">${noLabel}</button>
          </div>
        </div>`, 'her');

      async function finishForgiveness(){
        addText('خلاص سامحتك 😂❤', 'her');
        row.remove();
        await sayMine('يااااي! 🎉🎉 يلا بينا نطلع نتغدى');
        if (typeof confetti === 'function'){ confetti({particleCount:160, spread:100, origin:{y:0.6}}); }
        showCertificateCard();
        resolve();
      }

      row.querySelector('#yesBtn').addEventListener('click', finishForgiveness);

      row.querySelector('#noBtn').addEventListener('click', async () => {
        if (forced){ finishForgiveness(); return; }
        forgiveClicks++;
        addText('لسه شوية 😏', 'her');
        row.remove();
        await sayMine(forgiveClicks < MAX_FORGIVE_LOOPS ? 'طيب هحاول تاني بدلع أكتر 🥹' : 'يلا بجد كفاية بقى 😭😂');
        resolve(showFinalChoice());
      });
    });
  }

  function showCertificateCard(){
    const row = addBubble(`
      <div class="card-bubble">
        <input id="certName" placeholder="اكتبي اسمك" value="شهد" style="width:100%;padding:8px 12px;border-radius:20px;border:1.5px solid #eee;text-align:center;margin-bottom:8px;font-family:Cairo,sans-serif;">
        <button class="continue-btn" id="genCertBtn">اعملي شهادة سماح رسمية 📜</button>
        <div id="certAttachWrap"></div>
        <canvas id="certCanvas" width="560" height="340" style="display:none;"></canvas>
      </div>`, 'her');

    row.querySelector('#genCertBtn').addEventListener('click', () => {
      const canvas = row.querySelector('#certCanvas');
      const ctx = canvas.getContext('2d');
      const name = row.querySelector('#certName').value || 'شهد';
      const today = new Date().toLocaleDateString('ar-EG');

      ctx.fillStyle = '#fdf1e4'; ctx.fillRect(0,0,560,340);
      ctx.strokeStyle = '#f2709c'; ctx.lineWidth = 7; ctx.strokeRect(12,12,536,316);
      ctx.strokeStyle = '#2ec4b6'; ctx.lineWidth = 2; ctx.strokeRect(22,22,516,296);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#f2709c'; ctx.font = '26px Cairo, sans-serif';
      ctx.fillText('🏅 شهادة سماح رسمية 🏅', 280, 80);
      ctx.fillStyle = '#1b1b2f'; ctx.font = '18px Cairo, sans-serif';
      ctx.fillText('تشهد هذه الوثيقة بأن', 280, 130);
      ctx.fillStyle = '#1b7a70'; ctx.font = 'bold 32px Cairo, sans-serif';
      ctx.fillText(name, 280, 175);
      ctx.fillStyle = '#1b1b2f'; ctx.font = '16px Cairo, sans-serif';
      ctx.fillText('كسبت التحدي، وسامحت عمر رسميًا 😄', 280, 215);
      ctx.font = '14px Cairo, sans-serif'; ctx.fillStyle = '#f2709c';
      ctx.fillText('بتاريخ: ' + today, 280, 255);
      ctx.font = '20px Cairo, sans-serif'; ctx.fillStyle = '#1b1b2f';
      ctx.fillText('🎉💜🎊', 280, 295);

      row.querySelector('#certAttachWrap').innerHTML = `
        <div class="attach-bubble" style="margin-top:10px;">
          <div class="attach-icon">📜</div>
          <div class="attach-text">شهادة_سماح.png</div>
          <button class="attach-dl" id="dlCertBtn">تحميل</button>
        </div>`;
      row.querySelector('#dlCertBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'شهادة_سماح.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  }

  /* ---------------- GLOBAL SOUND TOGGLE ---------------- */
  document.getElementById('soundToggle').addEventListener('click', function(){
    if (!ytReady) return;
    if (ytPlaying){ ytPlayer.pauseVideo(); ytPlaying = false; this.textContent = '🔇'; }
    else { ytPlayer.playVideo(); ytPlaying = true; this.textContent = '🔊'; }
  });

  /* clock */
  function updateClock(){
    document.getElementById('clock').textContent = timeNow();
  }
  updateClock();
  setInterval(updateClock, 30000);

  /* start */
  run();
</script>

</body>
</html>
